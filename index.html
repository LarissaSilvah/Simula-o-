<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento EPI - Eletricista em Altura</title>
    <style>
        :root {
            --bg-primary: #12181b;
            --bg-secondary: #2a2e33;
            --accent: #2080f5;
            --text: #ffffff;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background-color: #1e2429;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--bg-secondary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 { margin: 0 0 5px 0; font-size: 1.5em; color: var(--warning); }
        p.subtitle { margin: 0; color: #a0aab0; font-size: 0.9em; }

        .hud {
            display: flex;
            justify-content: space-around;
            background-color: var(--bg-secondary);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        main {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .avatar-container {
            flex: 1;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .avatar-wrapper {
            position: relative;
            width: 220px;
            height: 380px;
            background: #191c1f;
            border-radius: 8px;
        }

        #worker-avatar { width: 100%; height: 100%; }

        /* Zonas de clique transparentes e sem pontilhados */
        .drop-zone {
            position: absolute;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .drop-zone:hover {
            background-color: rgba(40, 167, 69, 0.25);
        }

        .drop-zone.head { top: 2%; left: 30%; width: 40%; height: 12%; }
        .drop-zone.eyes { top: 15%; left: 30%; width: 40%; height: 8%; }
        .drop-zone.ears { top: 15%; left: 15%; width: 70%; height: 8%; }
        .drop-zone.trunk { top: 25%; left: 22%; width: 56%; height: 30%; }
        .drop-zone.hands { top: 48%; left: 5%; width: 90%; height: 14%; }
        .drop-zone.anchorage { top: 60%; left: 28%; width: 44%; height: 16%; }
        .drop-zone.feet { top: 82%; left: 20%; width: 60%; height: 15%; }

        .epis-container {
            flex: 1.2;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 15px;
        }

        .epi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .epi-card {
            background-color: #1e2429;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.8em;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90px;
        }

        .epi-card.selected {
            border-color: var(--warning);
            background-color: #323940;
        }

        .epi-card.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .epi-card svg { width: 32px; height: 32px; margin-bottom: 5px; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: var(--bg-secondary);
            padding: 25px;
            border-radius: 10px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 2px solid var(--accent);
        }

        .modal-box button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        @media (max-width: 700px) {
            main { flex-direction: column; }
            .avatar-wrapper { width: 180px; height: 320px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Cenário: Eletricista em Altura</h1>
            <p class="subtitle">Selecione o EPI e clique na região do corpo correspondente.</p>
        </header>

        <div class="hud">
            <div>Vidas: <span id="lives-val" style="color:var(--danger)">3</span></div>
            <div>EPIs Equipados: <span id="progress-val">0/7</span></div>
        </div>

        <main>
            <div class="avatar-container">
                <div class="avatar-wrapper">
                    <svg id="worker-avatar" viewBox="0 0 200 380" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="100" cy="370" rx="55" ry="8" fill="rgba(0,0,0,0.3)"/>
                        <path d="M72 220 L68 345 L88 345 L97 230 L103 230 L112 345 L132 345 L128 220 Z" fill="#2d3748"/>
                        <rect x="91" y="88" width="18" height="25" fill="#fbd38d"/>
                        <path d="M58 110 Q100 100 142 110 L146 220 L54 220 Z" fill="#3182ce"/>
                        <path d="M58 110 L38 190 L50 195 L68 125 Z" fill="#2b6cb0"/>
                        <circle cx="43" cy="200" r="9" fill="#fbd38d"/>
                        <path d="M142 110 L162 190 L150 195 L132 125 Z" fill="#2b6cb0"/>
                        <circle cx="157" cy="200" r="9" fill="#fbd38d"/>
                        <ellipse cx="100" cy="68" rx="22" ry="26" fill="#fbd38d"/>
                        <circle cx="90" cy="66" r="2.5" fill="#2d3748"/>
                        <circle cx="110" cy="66" r="2.5" fill="#2d3748"/>

                        <!-- Camadas dinâmicas dos EPIs -->
                        <g id="layer-head"></g>
                        <g id="layer-eyes"></g>
                        <g id="layer-ears"></g>
                        <g id="layer-trunk"></g>
                        <g id="layer-hands"></g>
                        <g id="layer-anchorage"></g>
                        <g id="layer-feet"></g>
                    </svg>

                    <div class="drop-zone head" data-zone="head" title="Cabeça"></div>
                    <div class="drop-zone eyes" data-zone="eyes" title="Olhos/Visão"></div>
                    <div class="drop-zone ears" data-zone="ears" title="Ouvidos"></div>
                    <div class="drop-zone trunk" data-zone="trunk" title="Tronco"></div>
                    <div class="drop-zone hands" data-zone="hands" title="Mãos"></div>
                    <div class="drop-zone anchorage" data-zone="anchorage" title="Ancoragem/Cinto"></div>
                    <div class="drop-zone feet" data-zone="feet" title="Pés"></div>
                </div>
            </div>

            <div class="epis-container">
                <div class="epi-grid" id="epi-grid"></div>
            </div>
        </main>
    </div>

    <div class="modal" id="modal">
        <div class="modal-box">
            <h2 id="modal-title">Aviso</h2>
            <p id="modal-desc"></p>
            <button onclick="closeModal()">Continuar</button>
        </div>
    </div>

    <script>
        const episDatabase = [
            // EPIs CORRETOS DO ELETRICISTA EM ALTURA
            { 
                id: 'cap_classe_b', 
                name: 'Capacete Classe B (c/ Jugular)', 
                zone: 'head', 
                isCorrect: true, 
                svg: `<svg viewBox="0 0 64 64"><path d="M12 40 C12 18, 52 18, 52 40 L58 44 L6 44 Z" fill="#ffc107"/><path d="M22 44 Q32 54 42 44" stroke="#333" stroke-width="2" fill="none"/></svg>`, 
                draw: `<path d="M70 46 C70 20, 130 20, 130 46 L142 50 L58 50 Z" fill="#ffc107" stroke="#333" stroke-width="1.5"/><path d="M78 50 Q100 70 122 50" stroke="#222" stroke-width="3" fill="none"/>` 
            },
            { 
                id: 'oculos_protecao', 
                name: 'Óculos de Proteção Incolor', 
                zone: 'eyes', 
                isCorrect: true, 
                svg: `<svg viewBox="0 0 64 64"><path d="M8 26 C8 20, 28 20, 28 26 L28 36 C28 42, 8 42, 8 36 Z" fill="#17a2b8"/><path d="M36 26 C36 20, 56 20, 56 26 L56 36 C56 42, 36 42, 36 36 Z" fill="#17a2b8"/><rect x="26" y="28" width="12" height="4" fill="#333"/></svg>`, 
                draw: `<path d="M80 60 C80 54, 96 54, 96 60 L96 72 C96 75, 80 75, 80 72 Z" fill="#17a2b8" opacity="0.85" stroke="#fff"/><path d="M104 60 C104 54, 120 54, 120 60 L120 72 C120 75, 104 75, 104 72 Z" fill="#17a2b8" opacity="0.85" stroke="#fff"/><rect x="94" y="63" width="12" height="3" fill="#333"/>` 
            },
            { 
                id: 'protetor_plug', 
                name: 'Protetor Auricular Plug', 
                zone: 'ears', 
                isCorrect: true, 
                svg: `<svg viewBox="0 0 64 64"><path d="M16 20 L24 20 L20 36 Z" fill="#ff5722"/><path d="M48 20 L40 20 L44 36 Z" fill="#ff5722"/></svg>`, 
                draw: `<circle cx="75" cy="68" r="5" fill="#ff5722"/><circle cx="125" cy="68" r="5" fill="#ff5722"/>` 
            },
            { 
                id: 'vestimenta_fr', 
                name: 'Vestimenta Retardante (FR)', 
                zone: 'trunk', 
                isCorrect: true, 
                svg: `<svg viewBox="0 0 64 64"><path d="M16 12 L48 12 L56 56 L8 56 Z" fill="#fd7e14"/><rect x="12" y="32" width="40" height="6" fill="#e0e0e0"/></svg>`, 
                draw: `<path d="M55 108 Q100 98 145 108 L148 222 L52 222 Z" fill="#fd7e14"/><rect x="60" y="170" width="80" height="12" fill="#e0e0e0"/>` 
            },
            { 
                id: 'luva_dieletrica', 
                name: 'Luva Isolante de Borracha', 
                zone: 'hands', 
                isCorrect: true, 
                svg: `<svg viewBox="0 0 64 64"><path d="M16 20 L32 20 L32 50 L16 50 Z" fill="#212529"/><rect x="16" y="42" width="16" height="6" fill="#dc3545"/></svg>`, 
                draw: `<path d="M30 185 L50 190 L54 214 L32 214 Z" fill="#212529"/><path d="M170 185 L150 190 L146 214 L168 214 Z" fill="#212529"/>` 
            },
            { 
                id: 'cinto_paraquedista', 
                name: 'Cinto Paraquedista Dielétrico', 
                zone: 'anchorage', 
                isCorrect: true, 
                svg: `<svg viewBox="0 0 64 64"><path d="M20 10 L26 54 M44 10 L38 54 M16 28 L48 28" stroke="#ff5722" stroke-width="5" fill="none"/></svg>`, 
                draw: `<path d="M72 110 L82 220 M128 110 L118 220 M60 145 L140 145" stroke="#ff5722" stroke-width="5" fill="none"/>` 
            },
            { 
                id: 'bota_dieletrica', 
                name: 'Calçado Isolante Elétrico', 
                zone: 'feet', 
                isCorrect: true, 
                svg: `<svg viewBox="0 0 64 64"><path d="M16 12 L32 12 L32 40 L52 40 L52 52 L16 52 Z" fill="#212529"/><rect x="16" y="48" width="36" height="6" fill="#ffc107"/></svg>`, 
                draw: `<path d="M60 340 L90 340 L90 365 C90 370 60 370 60 365 Z" fill="#212529"/><path d="M110 340 L140 340 L140 365 C140 370 110 370 110 365 Z" fill="#212529"/>` 
            },

            // EPIs INCORRETOS
            { 
                id: 'mascara_solda', 
                name: 'Máscara de Solda', 
                zone: 'eyes', 
                isCorrect: false, 
                svg: `<svg viewBox="0 0 64 64"><path d="M18 12 L46 12 L48 48 C48 56, 16 56, 16 48 Z" fill="#212529"/><rect x="24" y="24" width="16" height="10" fill="#28a745" stroke="#fff"/></svg>`,
                belongsTo: 'Soldador (NR-18)',
                reason: 'A máscara escura obstrui a visão do eletricista ao manusear painéis e fiação de precisão.'
            },
            { 
                id: 'luva_raspa', 
                name: 'Luva de Raspa de Couro', 
                zone: 'hands', 
                isCorrect: false, 
                svg: `<svg viewBox="0 0 64 64"><path d="M18 16 L28 8 L38 16 L38 52 L18 52 Z" fill="#8d6e63"/></svg>`,
                belongsTo: 'Soldador / Carga Pesada (NR-18)',
                reason: 'O couro comum não possui capacidade de isolamento contra choques de alta ou baixa tensão.'
            },
            { 
                id: 'colete_refletivo', 
                name: 'Colete Refletivo Sintético', 
                zone: 'trunk', 
                isCorrect: false, 
                svg: `<svg viewBox="0 0 64 64"><path d="M16 12 L48 12 L54 54 L10 54 Z" fill="#ccff00"/></svg>`,
                belongsTo: 'Operador de Máquinas / Tráfego (NR-12)',
                reason: 'O poliéster do colete pode derreter na pele em caso de arco elétrico. O eletricista exige traje Retardante de Chama (FR).'
            },
            { 
                id: 'touca_arabe', 
                name: 'Touca Árabe de Soldador', 
                zone: 'head', 
                isCorrect: false, 
                svg: `<svg viewBox="0 0 64 64"><path d="M16 20 Q32 8 48 20 L52 56 L12 56 Z" fill="#d7ccc8"/><circle cx="32" cy="24" r="14" fill="#fbd38d"/></svg>`,
                belongsTo: 'Soldador em Espaço Confinado (NR-33)',
                reason: 'Projetada contra projeções de respingos de solda, não oferecendo proteção contra impactos mecânicos em altura.'
            }
        ];

        let selectedEpi = null;
        let lives = 3;
        let equippedCount = 0;
        const totalRequired = 7;

        const epiGrid = document.getElementById('epi-grid');
        const modal = document.getElementById('modal');

        function init() {
            epiGrid.innerHTML = '';
            episDatabase.forEach(epi => {
                const card = document.createElement('div');
                card.className = 'epi-card';
                card.id = `card-${epi.id}`;
                card.innerHTML = `${epi.svg}<span>${epi.name}</span>`;
                card.onclick = () => selectEpi(epi, card);
                epiGrid.appendChild(card);
            });

            document.querySelectorAll('.drop-zone').forEach(zone => {
                zone.onclick = () => applyEpi(zone.dataset.zone);
            });
        }

        function selectEpi(epi, element) {
            if (element.classList.contains('disabled')) return;
            document.querySelectorAll('.epi-card').forEach(c => c.classList.remove('selected'));
            selectedEpi = epi;
            element.classList.add('selected');
        }

        function applyEpi(zoneName) {
            if (!selectedEpi) {
                showModal("Selecione um EPI", "Clique primeiro em um EPI da lista à direita.");
                return;
            }

            if (!selectedEpi.isCorrect) {
                lives--;
                document.getElementById('lives-val').textContent = lives;
                showModal(
                    "❌ EPI Incorreto!", 
                    `O item <strong>${selectedEpi.name}</strong> pertence ao <strong>${selectedEpi.belongsTo}</strong>.<br><br><em>Motivo:</em> ${selectedEpi.reason}`
                );
                
                if (lives <= 0) {
                    showModal("Game Over", "Você cometeu muitos erros de segurança! Reiniciando...", () => location.reload());
                }
                return;
            }

            if (selectedEpi.zone !== zoneName) {
                showModal("Local Incorreto", `O item ${selectedEpi.name} não deve ser colocado nesta parte do corpo.`);
                return;
            }

            document.getElementById(`layer-${zoneName}`).innerHTML += selectedEpi.draw;
            const card = document.getElementById(`card-${selectedEpi.id}`);
            card.classList.add('disabled');
            card.classList.remove('selected');
            
            selectedEpi = null;
            equippedCount++;
            document.getElementById('progress-val').textContent = `${equippedCount}/${totalRequired}`;

            if (equippedCount >= totalRequired) {
                showModal("🎉 Parabéns!", "Você equipou o Eletricista em Altura perfeitamente seguindo as NRs 10 e 35!");
            }
        }

        function showModal(title, desc, callback) {
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-desc').innerHTML = desc;
            modal.style.display = 'flex';
            window.modalCallback = callback;
        }

        function closeModal() {
            modal.style.display = 'none';
            if (window.modalCallback) {
                window.modalCallback();
                window.modalCallback = null;
            }
        }

        window.onload = init;
    </script>
</body>
                            </html>
