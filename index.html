<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento de Segurança do Trabalho - EPIs Profissionais</title>
    <style>
        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #e0e0e0;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --border-color: #0f3460;
            --card-background: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .container {
            width: 95%;
            max-width: 1350px;
            background-color: var(--secondary-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--text-color);
            letter-spacing: 1px;
        }

        .game-info {
            display: flex;
            gap: 20px;
            font-size: 0.95em;
        }

        .info-item span { font-weight: bold; }
        #timer .value { font-size: 1.2em; color: var(--warning-color); }
        #lives .value { color: var(--danger-color); }
        #score .value { color: var(--success-color); }

        main {
            display: flex;
            gap: 25px;
            min-height: 600px;
        }

        .left-panel, .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .scenarios, .character-display, .epis-available {
            background-color: var(--card-background);
            padding: 15px 20px;
            border-radius: 8px;
        }

        .scenarios h3, .character-display h3, .epis-available h3 {
            margin: 0 0 10px 0;
            font-size: 1.1em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .scenario-buttons button {
            background-color: var(--accent-color);
            color: var(--text-color);
            border: 1px solid transparent;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
        }

        .scenario-buttons button:hover { filter: brightness(1.2); }
        .scenario-buttons button.active {
            background-color: var(--success-color);
            font-weight: bold;
        }

        /* Área do Trabalhador */
        .character-display {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 480px;
            justify-content: flex-start;
        }

        #worker-avatar {
            width: 220px;
            height: 410px;
            margin-top: 5px;
        }

        /* Zonas de Encaixe totalmente invisíveis / Limpas */
        .drop-zone {
            position: absolute;
            background: transparent;
            border: none;
            box-sizing: border-box;
            z-index: 10;
            border-radius: 6px;
            transition: background-color 0.2s, border 0.2s;
        }

        /* Realce sutil apenas ao arrastar um item sobre a zona */
        .drop-zone.drag-over {
            background-color: rgba(40, 167, 69, 0.25);
            border: 2px dashed var(--success-color);
        }

        /* Coordenadas e áreas invisíveis de colisão */
        .drop-zone.head { top: 40px; width: 85px; height: 50px; }
        .drop-zone.eyes { top: 92px; width: 65px; height: 22px; }
        .drop-zone.ears { top: 95px; width: 95px; height: 26px; }
        .drop-zone.trunk { top: 135px; width: 110px; height: 110px; }
        .drop-zone.hands { top: 220px; width: 150px; height: 40px; }
        .drop-zone.feet { top: 370px; width: 110px; height: 40px; }
        .drop-zone.anchorage { top: 260px; width: 95px; height: 50px; }

        /* Lista de EPIs */
        .epi-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
            gap: 12px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .epi-item {
            background-color: var(--accent-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            cursor: grab;
            font-size: 0.8em;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 95px;
            box-sizing: border-box;
            touch-action: none;
        }

        .epi-item svg {
            width: 40px;
            height: 40px;
            margin-bottom: 4px;
            pointer-events: none;
        }

        .epi-item span {
            pointer-events: none;
        }

        .epi-item:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .epi-item.dragging { opacity: 0.3; }

        /* Modais */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid var(--border-color);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            background-color: var(--accent-color);
            color: var(--text-color);
        }

        .modal-buttons button.primary { background-color: var(--success-color); }

        #certificate {
            display: none;
            margin-top: 15px;
            background-color: #1a252f;
            padding: 15px;
            border: 2px dashed var(--warning-color);
            border-radius: 8px;
        }

        @media (max-width: 900px) {
            main { flex-direction: column; }
            .character-display { height: 480px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Segurança Profissional</div>
            <div class="game-info">
                <div id="timer" class="info-item">Tempo: <span class="value">60</span>s</div>
                <div id="score" class="info-item">Pontos: <span class="value">0</span></div>

        </header>

        <main>
            <div class="left-panel">
                <div class="scenarios">
                    <h3>1. Selecione o Cenário</h3>

                        <button data-scenario="soldador">Cenário 2: Soldador em Espaço Confinado</button>

                </div>

                <div class="character-display">
                    <h3>2. Arraste os EPIs para vestir o Trabalhador</h3>
                    
                    <!-- Vetor Base do Trabalhador + Camadas de Equipamento integradas -->

                        <ellipse cx="100" cy="370" rx="55" ry="8" fill="rgba(0,0,0,0.3)"/>
                        
                        <!-- Calça Base -->

                        <path d="M70 280 L87 280 M113 280 L130 280" stroke="#1a202c" stroke-width="1.5"/>
                        
                        <!-- Pés Base -->
                        <g id="base-feet">

                        <!-- Tronco Base / Camisa -->

                            <rect x="112" y="130" width="20" height="24" rx="2" fill="#2b6cb0"/>

                        <!-- Pescoço -->
                        <rect x="91" y="88" width="18" height="25" fill="#fbd38d"/>
                        
                        <!-- Braços Base -->
                        <g id="base-arms">
                            <path d="M58 110 L38 190 L50 195 L68 125 Z" fill="#2b6cb0"/>
                            <circle cx="43" cy="200" r="9" fill="#fbd38d"/>
                            <path d="M142 110 L162 190 L150 195 L132 125 Z" fill="#2b6cb0"/>
                            <circle cx="157" cy="200" r="9" fill="#fbd38d"/>
                        </g>
                        
                        <!-- Cabeça e Rosto Base -->
                        <g id="base-head">
                            <ellipse cx="100" cy="68" rx="22" ry="26" fill="#fbd38d"/>
                            <path d="M78 62 C78 42 122 42 122 62 C115 50 85 50 78 62 Z" fill="#4a5568"/>
                            <path d="M86 58 L94 60 M106 60 L114 58" stroke="#2d3748" stroke-width="2"/>
                            <circle cx="90" cy="66" r="2.5" fill="#2d3748"/>
                            <circle cx="110" cy="66" r="2.5" fill="#2d3748"/>
                            <path d="M100 68 L98 74 L102 74" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
                            <path d="M93 80 Q100 85 107 80" stroke="#e53e3e" stroke-width="2" fill="none"/>
                            <circle cx="77" cy="68" r="4.5" fill="#fbd38d"/>
                            <circle cx="123" cy="68" r="4.5" fill="#fbd38d"/>
                        </g>

                        <!-- CAMADAS ONDE OS EPIS SERÃO VESTIDOS (DRAMATICAMENTE ENCAIXADOS NO BONECO) -->
                        <g id="layer-feet"></g>
                        <g id="layer-trunk"></g>
                        <g id="layer-anchorage"></g>
                        <g id="layer-hands"></g>
                        <g id="layer-ears"></g>
                        <g id="layer-eyes"></g>
                        <g id="layer-head"></g>
                    </svg>

                    <!-- Zonas de Colisão Invisíveis (sem bordas/pontilhados) -->
                    <div class="drop-zone head" data-zone="head"></div>
                    <div class="drop-zone eyes" data-zone="eyes"></div>
                    <div class="drop-zone ears" data-zone="ears"></div>
                    <div class="drop-zone trunk" data-zone="trunk"></div>
                    <div class="drop-zone hands" data-zone="hands"></div>
                    <div class="drop-zone feet" data-zone="feet"></div>
                    <div class="drop-zone anchorage" data-zone="anchorage"></div>
                </div>
            </div>

            <div class="right-panel">
                <div class="epis-available">
                    <h3>3. EPIs Disponíveis</h3>
                    <div class="epi-list" id="epi-list">
                        <!-- Itens gerados via JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Resultado -->
    <div class="modal" id="game-modal">
        <div class="modal-content">
            <h2 id="modal-title">Resultado</h2>
            <p id="modal-message"></p>
            
            <div id="certificate">
                <h3>Certificado de Conclusão</h3>
                <p>Treinamento de Segurança do Trabalho (NRs)</p>
                <p>Pontuação Final: <strong id="cert-score">0</strong></p>
            </div>

            <div class="modal-buttons">
                <button class="primary" onclick="restartGame()">Tentar Novamente</button>
            </div>
        </div>
    </div>

    <script>
        // Ícones dos cards da lista
        const svgCardIcons = {
            cap_classe_b: `<svg viewBox="0 0 64 64"><path d="M12 40 C12 18, 52 18, 52 40 L58 44 L6 44 Z" fill="#ffc107"/><rect x="22" y="38" width="20" height="4" fill="#333"/></svg>`,

            abafador_concha: `<svg viewBox="0 0 64 64"><path d="M16 20 Q32 4 48 20" fill="none" stroke="#333" stroke-width="6"/><rect x="10" y="24" width="12" height="22" rx="5" fill="#dc3545"/><rect x="42" y="24" width="12" height="22" rx="5" fill="#dc3545"/></svg>`,
            vestiment_nr10: `<svg viewBox="0 0 64 64"><path d="M16 12 L48 12 L56 56 L8 56 Z" fill="#fd7e14"/><rect x="12" y="32" width="40" height="6" fill="#e0e0e0"/></svg>`,
            avental_raspa: `<svg viewBox="0 0 64 64"><path d="M20 12 L44 12 L48 58 L16 58 Z" fill="#8d6e63"/></svg>`,
            colete_refletivo: `<svg viewBox="0 0 64 64"><path d="M16 12 L48 12 L54 54 L10 54 Z" fill="#ccff00"/><rect x="12" y="28" width="40" height="6" fill="#e0e0e0"/><rect x="12" y="40" width="40" height="6" fill="#e0e0e0"/></svg>`,
            luva_dieletrica: `<svg viewBox="0 0 64 64"><path d="M16 20 L24 10 L32 20 L32 50 L16 50 Z" fill="#212529"/><rect x="16" y="42" width="32" height="8" fill="#dc3545"/></svg>`,
            luva_raspa: `<svg viewBox="0 0 64 64"><path d="M18 16 L28 8 L38 16 L38 52 L18 52 Z" fill="#d7ccc8"/></svg>`,
            luva_vaqueta: `<svg viewBox="0 0 64 64"><path d="M18 16 L28 8 L38 16 L38 52 L18 52 Z" fill="#fff8e1"/></svg>`,
            bota_dieletrica: `<svg viewBox="0 0 64 64"><path d="M16 12 L32 12 L32 40 L52 40 L52 52 L16 52 Z" fill="#212529"/><rect x="16" y="48" width="36" height="6" fill="#ffc107"/></svg>`,
            botina_biqueira: `<svg viewBox="0 0 64 64"><path d="M16 16 L32 16 L32 40 L52 40 L52 52 L16 52 Z" fill="#5d4037"/></svg>`,
            cinto_paraquedista: `<svg viewBox="0 0 64 64"><path d="M20 10 L26 54 M44 10 L38 54 M16 28 L48 28 M18 42 L46 42" stroke="#ff5722" stroke-width="5" fill="none"/></svg>`,
            linha_vida: `<svg viewBox="0 0 64 64"><rect x="20" y="12" width="24" height="28" rx="4" fill="#dc3545"/><circle cx="32" cy="58" r="4" fill="#ffc107"/></svg>`
        };

        // Vetores ajustados para VESTIR o boneco perfeitamente nas coordenadas (0 0 200 380)
        const fittedEpiGraphics = {
            cap_classe_b: `<path d="M70 54 C70 30, 130 30, 130 54 L142 58 L58 58 Z" fill="#ffc107" stroke="#333" stroke-width="1.5"/><rect x="85" y="50" width="30" height="5" fill="#333"/>`,
            cap_comum: `<path d="M70 54 C70 30, 130 30, 130 54 L142 58 L58 58 Z" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/><rect x="85" y="50" width="30" height="5" fill="#007bff"/>`,
            mascara_solda: `<path d="M70 38 L130 38 L132 88 C132 98, 68 98, 68 88 Z" fill="#212529"/><rect x="82" y="52" width="36" height="15" fill="#28a745" stroke="#fff" stroke-width="1.5"/>`,
            oculos_protecao: `<path d="M80 60 C80 54, 96 54, 96 60 L96 72 C96 76, 80 76, 80 72 Z" fill="#17a2b8" opacity="0.85" stroke="#fff"/><path d="M104 60 C104 54, 120 54, 120 60 L120 72 C120 76, 104 76, 104 72 Z" fill="#17a2b8" opacity="0.85" stroke="#fff"/><rect x="94" y="63" width="12" height="3" fill="#333"/>`,
            protetor_plug: `<circle cx="75" cy="68" r="4" fill="#ff5722"/><circle cx="125" cy="68" r="4" fill="#ff5722"/><path d="M75 68 Q100 100 125 68" fill="none" stroke="#ffc107" stroke-width="2"/>`,
            abafador_concha: `<path d="M74 48 Q100 30 126 48" fill="none" stroke="#333" stroke-width="5"/><rect x="68" y="58" width="10" height="20" rx="4" fill="#dc3545"/><rect x="122" y="58" width="10" height="20" rx="4" fill="#dc3545"/>`,
            vestiment_nr10: `<path d="M55 108 Q100 98 145 108 L148 222 L52 222 Z" fill="#fd7e14" stroke="#d97706" stroke-width="2"/><rect x="60" y="170" width="80" height="12" fill="#e0e0e0" opacity="0.9"/>`,
            avental_raspa: `<path d="M75 110 L125 110 L135 225 L65 225 Z" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/><path d="M85 90 L85 110 M115 90 L115 110" stroke="#5d4037" stroke-width="3"/>`,
            colete_refletivo: `<path d="M56 108 Q100 98 144 108 L147 220 L53 220 Z" fill="#ccff00" opacity="0.9"/><rect x="60" y="140" width="80" height="10" fill="#e0e0e0"/><rect x="60" y="180" width="80" height="10" fill="#e0e0e0"/>`,
            luva_dieletrica: `<path d="M32 188 L48 193 L52 212 L34 212 Z" fill="#212529"/><rect x="32" y="188" width="18" height="4" fill="#dc3545"/><path d="M168 188 L152 193 L148 212 L166 212 Z" fill="#212529"/><rect x="150" y="188" width="18" height="4" fill="#dc3545"/>`,
            luva_raspa: `<path d="M32 188 L48 193 L52 212 L34 212 Z" fill="#d7ccc8" stroke="#8d6e63"/><path d="M168 188 L152 193 L148 212 L166 212 Z" fill="#d7ccc8" stroke="#8d6e63"/>`,
            luva_vaqueta: `<path d="M32 188 L48 193 L52 212 L34 212 Z" fill="#fff8e1" stroke="#bcaaa4"/><path d="M168 188 L152 193 L148 212 L166 212 Z" fill="#fff8e1" stroke="#bcaaa4"/>`,
            bota_dieletrica: `<path d="M60 340 L90 340 L90 365 C90 370 60 370 60 365 Z" fill="#212529"/><rect x="60" y="360" width="30" height="5" fill="#ffc107"/><path d="M110 340 L140 340 L140 365 C140 370 110 370 110 365 Z" fill="#212529"/><rect x="110" y="360" width="30" height="5" fill="#ffc107"/>`,
            botina_biqueira: `<path d="M60 340 L90 340 L90 365 C90 370 60 370 60 365 Z" fill="#5d4037"/><path d="M110 340 L140 340 L140 365 C140 370 110 370 110 365 Z" fill="#5d4037"/>`,

            linha_vida: `<path d="M100 185 L100 270 L140 290" stroke="#dc3545" stroke-width="4" fill="none"/><circle cx="140" cy="290" r="5" fill="#ffc107"/>`
        };

        const episDatabase = [
            { id: 'cap_classe_b', name: 'Capacete Classe B', zone: 'head', validFor: ['eletricista'] },
            { id: 'cap_comum', name: 'Capacete Obra', zone: 'head', validFor: ['maquinas'] },
            { id: 'mascara_solda', name: 'Máscara de Solda', zone: 'head', validFor: ['soldador'] },
            { id: 'oculos_protecao', name: 'Óculos Incolor', zone: 'eyes', validFor: ['eletricista', 'maquinas'] },
            { id: 'protetor_plug', name: 'Protetor Plug', zone: 'ears', validFor: ['soldador', 'eletricista'] },
            { id: 'abafador_concha', name: 'Protetor Concha', zone: 'ears', validFor: ['maquinas'] },
            { id: 'vestiment_nr10', name: 'Traje NR10', zone: 'trunk', validFor: ['eletricista'] },
            { id: 'avental_raspa', name: 'Avental Raspa', zone: 'trunk', validFor: ['soldador'] },
            { id: 'colete_refletivo', name: 'Colete Refletivo', zone: 'trunk', validFor: ['maquinas'] },
            { id: 'luva_dieletrica', name: 'Luva Dielétrica', zone: 'hands', validFor: ['eletricista'] },
            { id: 'luva_raspa', name: 'Luva de Raspa', zone: 'hands', validFor: ['soldador'] },
            { id: 'luva_vaqueta', name: 'Luva Vaqueta', zone: 'hands', validFor: ['maquinas'] },
            { id: 'bota_dieletrica', name: 'Bota Isolante', zone: 'feet', validFor: ['eletricista'] },
            { id: 'botina_biqueira', name: 'Botina Biqueira', zone: 'feet', validFor: ['soldador', 'maquinas'] },
            { id: 'cinto_paraquedista', name: 'Cinto Paraquedista', zone: 'anchorage', validFor: ['eletricista'] },
            { id: 'linha_vida', name: 'Trava-Quedas', zone: 'anchorage', validFor: [] }
        ];

        let currentScenario = 'eletricista';
        let score = 0;
        let lives = 3;
        let timeLeft = 60;
        let timerInterval = null;
        let equippedZoneItems = {};
        let activeEpi = null;
        let touchProxy = null;

        const scenarioRequirements = {
            eletricista: ['head', 'eyes', 'ears', 'trunk', 'hands', 'feet', 'anchorage'],
            soldador: ['head', 'ears', 'trunk', 'hands', 'feet'],
            maquinas: ['head', 'eyes', 'ears', 'trunk', 'hands', 'feet']
        };

        const epiListEl = document.getElementById('epi-list');
        const timerEl = document.querySelector('#timer .value');
        const scoreEl = document.querySelector('#score .value');
        const livesEl = document.querySelector('#lives .value');
        const dropZones = document.querySelectorAll('.drop-zone');

        function initGame() {
            score = 0;
            lives = 3;
            timeLeft = 60;
            equippedZoneItems = {};
            updateHUD();
            renderEPIs();
            resetWorkerOutfit();
            startTimer();

            document.querySelectorAll('.scenario-buttons button').forEach(btn => {
                btn.onclick = (e) => {
                    document.querySelectorAll('.scenario-buttons button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentScenario = e.target.dataset.scenario;
                    restartGame();
                };
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame(false, "O tempo de 1 minuto acabou! O trabalhador ficou desprotegido.");
                }
            }, 1000);
        }

        function updateHUD() {
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            timerEl.textContent = timeLeft;
        }

        function renderEPIs() {
            epiListEl.innerHTML = '';
            const shuffled = [...episDatabase].sort(() => 0.5 - Math.random());
            shuffled.forEach(epi => {
                const item = document.createElement('div');
                item.className = 'epi-item';
                item.draggable = true;
                item.dataset.id = epi.id;
                item.innerHTML = `${svgCardIcons[epi.id]}<span>${epi.name}</span>`;

                // Eventos Drag (Mouse)
                item.addEventListener('dragstart', (e) => {
                    activeEpi = epi;
                    item.classList.add('dragging');
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                });

                // Eventos Touch (Celular/Tablet)
                item.addEventListener('touchstart', (e) => {
                    activeEpi = epi;
                    const touch = e.touches[0];
                    
                    touchProxy = item.cloneNode(true);
                    touchProxy.style.position = 'fixed';
                    touchProxy.style.pointerEvents = 'none';
                    touchProxy.style.zIndex = '9999';
                    touchProxy.style.opacity = '0.85';
                    touchProxy.style.width = '80px';
                    touchProxy.style.height = '80px';
                    touchProxy.style.left = `${touch.clientX - 40}px`;
                    touchProxy.style.top = `${touch.clientY - 40}px`;
                    document.body.appendChild(touchProxy);
                }, { passive: true });

                item.addEventListener('touchmove', (e) => {
                    if (!touchProxy) return;
                    const touch = e.touches[0];
                    touchProxy.style.left = `${touch.clientX - 40}px`;
                    touchProxy.style.top = `${touch.clientY - 40}px`;

                    const elemUnderFinger = document.elementFromPoint(touch.clientX, touch.clientY);
                    dropZones.forEach(z => z.classList.remove('drag-over'));
                    if (elemUnderFinger) {
                        const targetZone = elemUnderFinger.closest('.drop-zone');
                        if (targetZone) targetZone.classList.add('drag-over');
                    }
                }, { passive: true });

                item.addEventListener('touchend', (e) => {
                    if (touchProxy) {
                        touchProxy.remove();
                        touchProxy = null;
                    }
                    const touch = e.changedTouches[0];
                    const elemUnderFinger = document.elementFromPoint(touch.clientX, touch.clientY);
                    dropZones.forEach(z => z.classList.remove('drag-over'));

                    if (elemUnderFinger && activeEpi) {
                        const targetZone = elemUnderFinger.closest('.drop-zone');
                        if (targetZone) {
                            processDrop(targetZone, activeEpi);
                        }
                    }
                    activeEpi = null;
                });

                epiListEl.appendChild(item);
            });
        }

        function resetWorkerOutfit() {
            const layers = ['head', 'eyes', 'ears', 'trunk', 'hands', 'feet', 'anchorage'];
            layers.forEach(layer => {
                const layerEl = document.getElementById(`layer-${layer}`);
                if (layerEl) layerEl.innerHTML = '';
            });
        }

        dropZones.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                if (activeEpi) {
                    processDrop(zone, activeEpi);
                }
            });
        });

        function processDrop(zone, epi) {
            const targetZone = zone.dataset.zone;

            if (epi.zone !== targetZone) {
                registerError(`Local incorreto! O item ${epi.name} não pertence a essa parte do corpo.`);
                return;
            }

            if (epi.validFor.includes(currentScenario)) {
                equippedZoneItems[targetZone] = epi.id;
                
                // Aplica a peça diretamente no vetor do Trabalhador
                const layerEl = document.getElementById(`layer-${targetZone}`);
                if (layerEl) {
                    layerEl.innerHTML = fittedEpiGraphics[epi.id];
                }

                score += 15;
                updateHUD();
                checkWinCondition();
            } else {
                registerError(`EPI Inadequado! O item ${epi.name} não é correto para o cenário atual.`);
            }
        }

        function registerError(reason) {
            lives--;
            score = Math.max(0, score - 5);
            updateHUD();

            if (lives <= 0) {
                endGame(false, `Fim de jogo! ${reason}`);
            }
        }

        function checkWinCondition() {
            const requiredZones = scenarioRequirements[currentScenario];
            const allEquipped = requiredZones.every(zone => equippedZoneItems[zone]);

            if (allEquipped) {
                score += timeLeft * 2;
                endGame(true, "Excelente! Você vestiu o trabalhador perfeitamente conforme as Normas Regulamentadoras!");
            }
        }

        function endGame(isWin, message) {
            clearInterval(timerInterval);
            const modal = document.getElementById('game-modal');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-message');
            const cert = document.getElementById('certificate');

            title.textContent = isWin ? "Treinamento Concluído!" : "Aviso de Segurança!";
            title.style.color = isWin ? "var(--success-color)" : "var(--danger-color)";
            msg.textContent = message;

            if (isWin) {
                cert.style.display = 'block';
                document.getElementById('cert-score').textContent = score;
            } else {
                cert.style.display = 'none';
            }

            modal.style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('game-modal').style.display = 'none';
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
