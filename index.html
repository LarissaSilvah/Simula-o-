<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento de Segurança do Trabalho - EPIs Profissionais</title>
    <style>
        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #e0e0e0;
            --subtle-text-color: #b0b0b0;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --border-color: #0f3460;
            --card-background: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 95%;
            max-width: 1350px;
            background-color: var(--secondary-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.6em;
            font-weight: bold;
            color: var(--text-color);
            letter-spacing: 1px;
        }

        .game-info {
            display: flex;
            gap: 25px;
            font-size: 0.95em;
        }

        .info-item span { font-weight: bold; }
        #timer .value { font-size: 1.2em; color: var(--warning-color); }
        #lives .value { color: var(--danger-color); }
        #score .value { color: var(--success-color); }

        main {
            display: flex;
            gap: 25px;
            min-height: 600px;
        }

        .left-panel, .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .scenarios, .character-display, .epis-available {
            background-color: var(--card-background);
            padding: 15px 20px;
            border-radius: 8px;
        }

        .scenarios h3, .character-display h3, .epis-available h3 {
            margin: 0 0 10px 0;
            font-size: 1.1em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .scenario-buttons button {
            background-color: var(--accent-color);
            color: var(--text-color);
            border: 1px solid transparent;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
        }

        .scenario-buttons button:hover { filter: brightness(1.2); }
        .scenario-buttons button.active {
            background-color: var(--success-color);
            font-weight: bold;
        }

        /* Área do Trabalhador */
        .character-display {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 480px;
            justify-content: flex-start;
        }

        #worker-avatar {
            width: 200px;
            height: 380px;
            margin-top: 10px;
        }

        /* Zonas de Encaixe sobre o Boneco */
        .drop-zone {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1.5px dashed var(--subtle-text-color);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            color: var(--subtle-text-color);
            transition: all 0.2s ease;
            text-align: center;
            padding: 2px;
            box-sizing: border-box;
            z-index: 10;
        }

        .drop-zone.drag-over {
            background-color: rgba(40, 167, 69, 0.3);
            border-color: var(--success-color);
            transform: scale(1.05);
        }

        .drop-zone.equipped {
            background-color: rgba(22, 33, 62, 0.95);
            border: 2px solid var(--success-color);
            color: var(--text-color);
            font-weight: bold;
        }

        .drop-zone svg {
            width: 28px;
            height: 28px;
            margin-bottom: 2px;
        }

        /* Posicionamento preciso das Zonas no Avatar */
        .drop-zone.head { top: 45px; width: 100px; height: 50px; }
        .drop-zone.eyes { top: 100px; width: 80px; height: 35px; }
        .drop-zone.ears { top: 140px; width: 90px; height: 35px; }
        .drop-zone.trunk { top: 180px; width: 110px; height: 85px; }
        .drop-zone.hands { top: 270px; width: 130px; height: 40px; }
        .drop-zone.feet { top: 380px; width: 120px; height: 45px; }
        .drop-zone.anchorage { top: 320px; width: 120px; height: 45px; }

        /* Lista de EPIs com Ilustrações */
        .epi-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 12px;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .epi-item {
            background-color: var(--accent-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 5px;
            text-align: center;
            cursor: grab;
            font-size: 0.8em;
            user-select: none;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100px;
            box-sizing: border-box;
        }

        .epi-item svg {
            width: 42px;
            height: 42px;
            margin-bottom: 6px;
        }

        .epi-item:hover {
            filter: brightness(1.2);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .epi-item.dragging { opacity: 0.3; }

        /* Modais */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid var(--border-color);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            background-color: var(--accent-color);
            color: var(--text-color);
        }

        .modal-buttons button.primary { background-color: var(--success-color); }

        #certificate {
            display: none;
            margin-top: 15px;
            background-color: #1a252f;
            padding: 15px;
            border: 2px dashed var(--warning-color);
            border-radius: 8px;
        }

        @media (max-width: 900px) {
            main { flex-direction: column; }
            .character-display { height: 500px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Segurança Profissional</div>
            <div class="game-info">
                <div id="timer" class="info-item">Tempo: <span class="value">45</span>s</div>
                <div id="score" class="info-item">Pontos: <span class="value">0</span></div>
                <div id="lives" class="info-item">Vidas: <span class="value">3</span></div>
            </div>
        </header>

        <main>
            <div class="left-panel">
                <div class="scenarios">
                    <h3>1. Selecione o Cenário</h3>
                    <div class="scenario-buttons">
                        <button data-scenario="eletricista" class="active">Cenário 1: Eletricista em Altura</button>
                        <button data-scenario="soldador">Cenário 2: Soldador em Espaço Confinado</button>
                        <button data-scenario="maquinas">Cenário 3: Operador de Máquinas Pesadas</button>
                    </div>
                </div>

                <div class="character-display">
                    <h3>2. Arraste e Equipe o Trabalhador</h3>
                    
                    <!-- Vetor Detalhado do Avatar do Trabalhador -->
                    <svg id="worker-avatar" viewBox="0 0 200 380" xmlns="http://www.w3.org/2000/svg">
                        <!-- Sombra no Chão -->
                        <ellipse cx="100" cy="370" rx="55" ry="8" fill="rgba(0,0,0,0.3)"/>
                        
                        <!-- Calça de Trabalho -->
                        <path d="M72 220 L68 345 L88 345 L97 230 L103 230 L112 345 L132 345 L128 220 Z" fill="#2d3748"/>
                        <!-- Costuras e Dobras da Calça -->
                        <path d="M70 280 L87 280 M113 280 L130 280" stroke="#1a202c" stroke-width="1.5"/>
                        <path d="M100 230 L100 260" stroke="#1a202c" stroke-width="1.5"/>
                        
                        <!-- Sapatos Base -->
                        <path d="M63 345 L88 345 L88 360 C88 365 63 365 63 360 Z" fill="#1a202c"/>
                        <path d="M112 345 L137 345 L137 360 C137 365 112 365 112 360 Z" fill="#1a202c"/>
                        
                        <!-- Camisa de Trabalho (Tronco) -->
                        <path d="M58 110 Q100 100 142 110 L146 220 L54 220 Z" fill="#3182ce"/>
                        <path d="M100 110 L100 220" stroke="#2b6cb0" stroke-width="2"/>
                        <!-- Bolsos do Uniforme -->
                        <rect x="68" y="130" width="20" height="24" rx="2" fill="#2b6cb0"/>
                        <rect x="112" y="130" width="20" height="24" rx="2" fill="#2b6cb0"/>
                        
                        <!-- Pescoço -->
                        <rect x="91" y="88" width="18" height="25" fill="#fbd38d"/>
                        
                        <!-- Braço Esquerdo -->
                        <path d="M58 110 L38 190 L50 195 L68 125 Z" fill="#2b6cb0"/>
                        <circle cx="43" cy="200" r="9" fill="#fbd38d"/>
                        
                        <!-- Braço Direito -->
                        <path d="M142 110 L162 190 L150 195 L132 125 Z" fill="#2b6cb0"/>
                        <circle cx="157" cy="200" r="9" fill="#fbd38d"/>
                        
                        <!-- Cabeça / Rosto -->
                        <ellipse cx="100" cy="68" rx="22" ry="26" fill="#fbd38d"/>
                        <!-- Cabelo -->
                        <path d="M78 62 C78 42 122 42 122 62 C115 50 85 50 78 62 Z" fill="#4a5568"/>
                        <!-- Sobrancelhas -->
                        <path d="M86 58 L94 60 M106 60 L114 58" stroke="#2d3748" stroke-width="2"/>
                        <!-- Olhos -->
                        <circle cx="90" cy="66" r="2.5" fill="#2d3748"/>
                        <circle cx="110" cy="66" r="2.5" fill="#2d3748"/>
                        <!-- Nariz -->
                        <path d="M100 68 L98 74 L102 74" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
                        <!-- Boca/Sorriso -->
                        <path d="M93 80 Q100 85 107 80" stroke="#e53e3e" stroke-width="2" fill="none"/>
                        <!-- Orelhas -->
                        <circle cx="77" cy="68" r="4.5" fill="#fbd38d"/>
                        <circle cx="123" cy="68" r="4.5" fill="#fbd38d"/>
                    </svg>

                    <!-- Zonas de Encaixe -->
                    <div class="drop-zone head" data-zone="head">Cabeça</div>
                    <div class="drop-zone eyes" data-zone="eyes">Olhos</div>
                    <div class="drop-zone ears" data-zone="ears">Ouvidos</div>
                    <div class="drop-zone trunk" data-zone="trunk">Tronco</div>
                    <div class="drop-zone hands" data-zone="hands">Mãos</div>
                    <div class="drop-zone feet" data-zone="feet">Pés</div>
                    <div class="drop-zone anchorage" data-zone="anchorage">Ancoragem</div>
                </div>
            </div>

            <div class="right-panel">
                <div class="epis-available">
                    <h3>3. EPIs Disponíveis</h3>
                    <div class="epi-list" id="epi-list">
                        <!-- Itens gerados dinamicamente via JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Fim de Jogo -->
    <div class="modal" id="game-modal">
        <div class="modal-content">
            <h2 id="modal-title">Resultado</h2>
            <p id="modal-message"></p>
            
            <div id="certificate">
                <h3>Certificado de Conclusão</h3>
                <p>Treinamento de Segurança do Trabalho (NRs)</p>
                <p>Pontuação Final: <strong id="cert-score">0</strong></p>
            </div>

            <div class="modal-buttons">
                <button class="primary" onclick="restartGame()">Tentar Novamente</button>
            </div>
        </div>
    </div>

    <script>
        // Desenhos em SVG para cada EPI
        const svgIcons = {
            cap_classe_b: `<svg viewBox="0 0 64 64"><path d="M12 40 C12 18, 52 18, 52 40 L58 44 L6 44 Z" fill="#ffc107"/><rect x="22" y="38" width="20" height="4" fill="#333"/><path d="M28 22 L36 22 L32 30 Z" fill="#d39e00"/></svg>`,
            cap_comum: `<svg viewBox="0 0 64 64"><path d="M12 40 C12 20, 52 20, 52 40 L58 44 L6 44 Z" fill="#ffffff"/><rect x="20" y="38" width="24" height="4" fill="#007bff"/></svg>`,
            mascara_solda: `<svg viewBox="0 0 64 64"><path d="M18 12 L46 12 L48 48 C48 56, 16 56, 16 48 Z" fill="#212529"/><rect x="24" y="24" width="16" height="10" fill="#28a745" stroke="#fff" stroke-width="1.5"/></svg>`,
            oculos_protecao: `<svg viewBox="0 0 64 64"><path d="M8 26 C8 20, 28 20, 28 26 L28 36 C28 42, 8 42, 8 36 Z" fill="#17a2b8" opacity="0.8"/><path d="M36 26 C36 20, 56 20, 56 26 L56 36 C56 42, 36 42, 36 36 Z" fill="#17a2b8" opacity="0.8"/><rect x="26" y="28" width="12" height="4" fill="#333"/><path d="M4 28 L8 28 M56 28 L60 28" stroke="#333" stroke-width="3"/></svg>`,
            protetor_plug: `<svg viewBox="0 0 64 64"><path d="M16 20 L24 20 L20 36 Z" fill="#ff5722"/><path d="M48 20 L40 20 L44 36 Z" fill="#ff5722"/><path d="M20 36 Q32 54 44 36" fill="none" stroke="#ffc107" stroke-width="3"/></svg>`,
            abafador_concha: `<svg viewBox="0 0 64 64"><path d="M16 20 Q32 4 48 20" fill="none" stroke="#333" stroke-width="6"/><rect x="10" y="24" width="12" height="22" rx="5" fill="#dc3545"/><rect x="42" y="24" width="12" height="22" rx="5" fill="#dc3545"/></svg>`,
            vestiment_nr10: `<svg viewBox="0 0 64 64"><path d="M16 12 L48 12 L56 56 L8 56 Z" fill="#fd7e14"/><rect x="12" y="32" width="40" height="6" fill="#e0e0e0"/><path d="M28 12 L32 24 L36 12" stroke="#fff" stroke-width="2" fill="none"/></svg>`,
            avental_raspa: `<svg viewBox="0 0 64 64"><path d="M20 12 L44 12 L48 58 L16 58 Z" fill="#8d6e63"/><path d="M20 12 Q32 20 44 12" fill="none" stroke="#5d4037" stroke-width="3"/></svg>`,
            colete_refletivo: `<svg viewBox="0 0 64 64"><path d="M16 12 L48 12 L54 54 L10 54 Z" fill="#ccff00"/><rect x="12" y="28" width="40" height="6" fill="#e0e0e0"/><rect x="12" y="40" width="40" height="6" fill="#e0e0e0"/></svg>`,
            luva_dieletrica: `<svg viewBox="0 0 64 64"><path d="M16 20 L24 10 L32 20 L32 50 L16 50 Z" fill="#212529"/><path d="M32 20 L40 10 L48 20 L48 50 L32 50 Z" fill="#212529"/><rect x="16" y="42" width="32" height="8" fill="#dc3545"/></svg>`,
            luva_raspa: `<svg viewBox="0 0 64 64"><path d="M18 16 L28 8 L38 16 L38 52 L18 52 Z" fill="#d7ccc8"/><path d="M34 22 L44 16 L48 26 L38 30 Z" fill="#bcaaa4"/></svg>`,
            luva_vaqueta: `<svg viewBox="0 0 64 64"><path d="M18 16 L28 8 L38 16 L38 52 L18 52 Z" fill="#fff8e1"/><path d="M34 22 L44 16 L48 26 L38 30 Z" fill="#ffecb3"/></svg>`,
            bota_dieletrica: `<svg viewBox="0 0 64 64"><path d="M16 12 L32 12 L32 40 L52 40 L52 52 L16 52 Z" fill="#212529"/><rect x="16" y="48" width="36" height="6" fill="#ffc107"/></svg>`,
            botina_biqueira: `<svg viewBox="0 0 64 64"><path d="M16 16 L32 16 L32 40 L52 40 L52 52 L16 52 Z" fill="#5d4037"/><path d="M38 40 Q52 40 52 52 L38 52 Z" fill="#3e2723"/></svg>`,
            cinto_paraquedista: `<svg viewBox="0 0 64 64"><path d="M20 10 L26 54 M44 10 L38 54 M16 28 L48 28 M18 42 L46 42" stroke="#ff5722" stroke-width="5" fill="none"/><circle cx="32" cy="28" r="5" fill="#e0e0e0"/></svg>`,
            linha_vida: `<svg viewBox="0 0 64 64"><rect x="20" y="12" width="24" height="28" rx="4" fill="#dc3545"/><path d="M32 40 L32 58" stroke="#e0e0e0" stroke-width="4"/><circle cx="32" cy="58" r="4" fill="#ffc107"/></svg>`
        };

        // Banco de Dados dos EPIs
        const episDatabase = [
            { id: 'cap_classe_b', name: 'Capacete Classe B', zone: 'head', validFor: ['eletricista'] },
            { id: 'cap_comum', name: 'Capacete Obra', zone: 'head', validFor: ['maquinas'] },
            { id: 'mascara_solda', name: 'Máscara de Solda', zone: 'head', validFor: ['soldador'] },
            { id: 'oculos_protecao', name: 'Óculos Incolor', zone: 'eyes', validFor: ['eletricista', 'maquinas'] },
            { id: 'protetor_plug', name: 'Protetor Plug', zone: 'ears', validFor: ['soldador', 'eletricista'] },
            { id: 'abafador_concha', name: 'Protetor Concha', zone: 'ears', validFor: ['maquinas'] },
            { id: 'vestiment_nr10', name: 'Traje NR10', zone: 'trunk', validFor: ['eletricista'] },
            { id: 'avental_raspa', name: 'Avental Raspa', zone: 'trunk', validFor: ['soldador'] },
            { id: 'colete_refletivo', name: 'Colete Refletivo', zone: 'trunk', validFor: ['maquinas'] },
            { id: 'luva_dieletrica', name: 'Luva Dielétrica', zone: 'hands', validFor: ['eletricista'] },
            { id: 'luva_raspa', name: 'Luva de Raspa', zone: 'hands', validFor: ['soldador'] },
            { id: 'luva_vaqueta', name: 'Luva Vaqueta', zone: 'hands', validFor: ['maquinas'] },
            { id: 'bota_dieletrica', name: 'Bota sem Metal', zone: 'feet', validFor: ['eletricista'] },
            { id: 'botina_biqueira', name: 'Botina Biqueira', zone: 'feet', validFor: ['soldador', 'maquinas'] },
            { id: 'cinto_paraquedista', name: 'Cinto Paraquedista', zone: 'anchorage', validFor: ['eletricista'] },
            { id: 'linha_vida', name: 'Trava-Quedas', zone: 'anchorage', validFor: [] }
        ];

        // Estado do Jogo
        let currentScenario = 'eletricista';
        let score = 0;
        let lives = 3;
        let timeLeft = 45;
        let timerInterval = null;
        let equippedZoneItems = {};

        const scenarioRequirements = {
            eletricista: ['head', 'eyes', 'ears', 'trunk', 'hands', 'feet', 'anchorage'],
            soldador: ['head', 'ears', 'trunk', 'hands', 'feet'],
            maquinas: ['head', 'eyes', 'ears', 'trunk', 'hands', 'feet']
        };

        // Elementos DOM
        const epiListEl = document.getElementById('epi-list');
        const timerEl = document.querySelector('#timer .value');
        const scoreEl = document.querySelector('#score .value');
        const livesEl = document.querySelector('#lives .value');
        const dropZones = document.querySelectorAll('.drop-zone');

        function initGame() {
            score = 0;
            lives = 3;
            timeLeft = 45;
            equippedZoneItems = {};
            updateHUD();
            renderEPIs();
            resetDropZones();
            startTimer();

            document.querySelectorAll('.scenario-buttons button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.scenario-buttons button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentScenario = e.target.dataset.scenario;
                    restartGame();
                });
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame(false, "O tempo acabou! O trabalhador ficou desprotegido.");
                }
            }, 1000);
        }

        function updateHUD() {
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            timerEl.textContent = timeLeft;
        }

        function renderEPIs() {
            epiListEl.innerHTML = '';
            const shuffled = [...episDatabase].sort(() => 0.5 - Math.random());
            shuffled.forEach(epi => {
                const item = document.createElement('div');
                item.className = 'epi-item';
                item.draggable = true;
                item.dataset.id = epi.id;
                
                // Adiciona o desenho SVG + nome
                item.innerHTML = `${svgIcons[epi.id]}<span>${epi.name}</span>`;

                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragend', handleDragEnd);

                epiListEl.appendChild(item);
            });
        }

        function resetDropZones() {
            dropZones.forEach(zone => {
                zone.classList.remove('equipped', 'drag-over');
                const zoneType = zone.dataset.zone;
                zone.innerHTML = getZoneLabel(zoneType);
            });
        }

        function getZoneLabel(zone) {
            const labels = { head: 'Cabeça', eyes: 'Olhos', ears: 'Ouvidos', trunk: 'Tronco', hands: 'Mãos', feet: 'Pés', anchorage: 'Ancoragem' };
            return labels[zone] || zone;
        }

        let draggedEpi = null;

        function handleDragStart(e) {
            draggedEpi = episDatabase.find(item => item.id === e.target.dataset.id || item.id === e.target.parentElement.dataset.id);
            if (e.target.classList.contains('epi-item')) {
                e.target.classList.add('dragging');
            } else {
                e.target.parentElement.classList.add('dragging');
            }
        }

        function handleDragEnd(e) {
            document.querySelectorAll('.epi-item').forEach(i => i.classList.remove('dragging'));
        }

        dropZones.forEach(zone => {
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });

            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');

                if (!draggedEpi) return;

                const targetZone = zone.dataset.zone;

                if (draggedEpi.zone !== targetZone) {
                    registerError(`Local incorreto! O item ${draggedEpi.name} não vai nessa parte do corpo.`);
                    return;
                }

                if (draggedEpi.validFor.includes(currentScenario)) {
                    equippedZoneItems[targetZone] = draggedEpi.id;
                    zone.classList.add('equipped');
                    // Exibe o desenho do EPI na zona onde foi solto
                    zone.innerHTML = `${svgIcons[draggedEpi.id]}<span>${draggedEpi.name}</span>`;
                    score += 15;
                    updateHUD();
                    checkWinCondition();
                } else {
                    registerError(`EPI incorreto! O item ${draggedEpi.name} não é adequado para este cenário.`);
                }
            });
        });

        function registerError(reason) {
            lives--;
            score = Math.max(0, score - 5);
            updateHUD();

            if (lives <= 0) {
                endGame(false, `Você estourou o limite de erros de segurança. ${reason}`);
            }
        }

        function checkWinCondition() {
            const requiredZones = scenarioRequirements[currentScenario];
            const allEquipped = requiredZones.every(zone => equippedZoneItems[zone]);

            if (allEquipped) {
                score += timeLeft * 2;
                endGame(true, "Excelente! Você equipou o trabalhador com todos os EPIs corretos!");
            }
        }

        function endGame(isWin, message) {
            clearInterval(timerInterval);
            const modal = document.getElementById('game-modal');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-message');
            const cert = document.getElementById('certificate');

            title.textContent = isWin ? "Treinamento Concluído!" : "Aviso de Segurança!";
            title.style.color = isWin ? "var(--success-color)" : "var(--danger-color)";
            msg.textContent = message;

            if (isWin) {
                cert.style.display = 'block';
                document.getElementById('cert-score').textContent = score;
            } else {
                cert.style.display = 'none';
            }

            modal.style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('game-modal').style.display = 'none';
            initGame();
        }

        window.onload = initGame;
    </script>
</body>
</html>
