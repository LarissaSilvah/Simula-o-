<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinamento de Segurança do Trabalho - EPIs Profissionais</title>
    <style>
        :root {
            --primary-color: #1a1a2e;
            --secondary-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #e0e0e0;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --border-color: #0f3460;
            --card-background: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background-color: var(--secondary-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.4em;
            font-weight: bold;
            color: var(--text-color);
        }

        .game-info {
            display: flex;
            gap: 20px;
            font-size: 1em;
        }

        .info-item span { font-weight: bold; }
        #timer .value { color: var(--warning-color); }
        #lives .value { color: var(--danger-color); }
        #score .value { color: var(--success-color); }

        main {
            display: flex;
            gap: 20px;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .right-panel {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .scenarios, .character-display, .epis-available {
            background-color: var(--card-background);
            padding: 15px;
            border-radius: 8px;
        }

        .scenarios h3, .character-display h3, .epis-available h3 {
            margin: 0 0 10px 0;
            font-size: 1em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .scenario-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .scenario-buttons button {
            background-color: var(--accent-color);
            color: var(--text-color);
            border: 1px solid transparent;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .scenario-buttons button:hover { filter: brightness(1.2); }
        .scenario-buttons button.active {
            background-color: var(--success-color);
            font-weight: bold;
        }

        /* Avatar Container */
        .character-display {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 220px;
            height: 400px;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 8px;
        }

        #worker-avatar {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Areas de clique e soltura sem bordas visíveis */
        .drop-zone {
            position: absolute;
            box-sizing: border-box;
            border: none;
            outline: none;
            background: transparent;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .drop-zone.drag-over, .drop-zone.selected-target {
            background-color: rgba(40, 167, 69, 0.3) !important;
            border-radius: 6px;
        }

        .drop-zone.head { top: 4%; left: 32%; width: 36%; height: 11%; z-index: 10; }
        .drop-zone.eyes { top: 15%; left: 36%; width: 28%; height: 6%; z-index: 30; }
        .drop-zone.ears { top: 15%; left: 22%; width: 56%; height: 7%; z-index: 20; }
        .drop-zone.trunk { top: 26%; left: 24%; width: 52%; height: 32%; z-index: 5; }
        .drop-zone.hands { top: 47%; left: 10%; width: 80%; height: 12%; z-index: 15; }
        .drop-zone.anchorage { top: 58%; left: 30%; width: 40%; height: 18%; z-index: 12; }
        .drop-zone.feet { top: 88%; left: 26%; width: 48%; height: 10%; z-index: 10; }

        /* Lista de EPIs com rolagem corrigida */
        .epis-available {
            display: flex;
            flex-direction: column;
        }

        .epi-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding: 8px 5px;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }

        .epi-list::-webkit-scrollbar {
            width: 8px;
        }

        .epi-list::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 4px;
        }

        .epi-item {
            background-color: var(--accent-color);
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            font-size: 0.8em;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90px;
            box-sizing: border-box;
            touch-action: pan-y;
        }

        .epi-item.selected {
            border-color: var(--warning-color);
            background-color: #1e4976;
            transform: scale(1.03);
        }

        .epi-item svg {
            width: 38px;
            height: 38px;
            margin-bottom: 4px;
            pointer-events: none;
        }

        .epi-item span {
            pointer-events: none;
            line-height: 1.1;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-background);
            padding: 25px;
            border-radius: 10px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .modal-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            background-color: var(--success-color);
            color: white;
            margin-top: 15px;
        }

        #certificate {
            display: none;
            margin-top: 15px;
            background-color: #1a252f;
            padding: 15px;
            border: 2px dashed var(--warning-color);
            border-radius: 8px;
        }

        @media (max-width: 800px) {
            main { flex-direction: column; }
            .avatar-wrapper { width: 200px; height: 360px; }
            .epi-list { max-height: 300px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Segurança Profissional</div>
            <div class="game-info">
                <div id="timer" class="info-item">Tempo: <span class="value">60</span>s</div>
                <div id="score" class="info-item">Pontos: <span class="value">0</span></div>
                <div id="lives" class="info-item">Vidas: <span class="value">3</span></div>
            </div>
        </header>

        <main>
            <div class="left-panel">
                <div class="scenarios">
                    <h3>1. Selecione o Cenário</h3>
                    <div class="scenario-buttons">
                        <button data-scenario="eletricista" class="active">Eletricista em Altura</button>
                        <button data-scenario="soldador">Soldador em Espaço Confinado</button>
                        <button data-scenario="maquinas">Operador de Máquinas Pesadas</button>
                    </div>
                </div>

                <div class="character-display">
                    <h3>2. Clique no EPI e no Membro (ou Arraste)</h3>
                    
                    <div class="avatar-wrapper">
                        <svg id="worker-avatar" viewBox="0 0 200 380" xmlns="http://www.w3.org/2000/svg">
                            <ellipse cx="100" cy="370" rx="55" ry="8" fill="rgba(0,0,0,0.3)"/>
                            
                            <!-- Calça Base -->
                            <path d="M72 220 L68 345 L88 345 L97 230 L103 230 L112 345 L132 345 L128 220 Z" fill="#2d3748"/>
                            
                            <!-- Pés Base -->
                            <g id="base-feet">
                                <path d="M63 345 L88 345 L88 360 C88 365 63 365 63 360 Z" fill="#1a202c"/>
                                <path d="M112 345 L137 345 L137 360 C137 365 112 365 112 360 Z" fill="#1a202c"/>
                            </g>

                            <!-- Tronco Base -->
                            <g id="base-trunk">
                                <path d="M58 110 Q100 100 142 110 L146 220 L54 220 Z" fill="#3182ce"/>
                            </g>
                            
                            <!-- Pescoço -->
                            <rect x="91" y="88" width="18" height="25" fill="#fbd38d"/>
                            
                            <!-- Braços Base -->
                            <g id="base-arms">
                                <path d="M58 110 L38 190 L50 195 L68 125 Z" fill="#2b6cb0"/>
                                <circle cx="43" cy="200" r="9" fill="#fbd38d"/>
                                <path d="M142 110 L162 190 L150 195 L132 125 Z" fill="#2b6cb0"/>
                                <circle cx="157" cy="200" r="9" fill="#fbd38d"/>
                            </g>
                            
                            <!-- Cabeça e Olhos Base -->
                            <g id="base-head">
                                <ellipse cx="100" cy="68" rx="22" ry="26" fill="#fbd38d"/>
                                <circle cx="90" cy="66" r="2.5" fill="#2d3748"/>
                                <circle cx="110" cy="66" r="2.5" fill="#2d3748"/>
                                <path d="M93 80 Q100 85 107 80" stroke="#e53e3e" stroke-width="2" fill="none"/>
                            </g>

                            <!-- Layer do vestuário do trabalhador -->
                            <g id="layer-feet"></g>
                            <g id="layer-trunk"></g>
                            <g id="layer-anchorage"></g>
                            <g id="layer-hands"></g>
                            <g id="layer-ears"></g>
                            <g id="layer-eyes"></g>
                            <g id="layer-head"></g>
                        </svg>

                        <!-- Zonas de Colisão/Clique -->
                        <div class="drop-zone head" data-zone="head" title="Cabeça"></div>
                        <div class="drop-zone eyes" data-zone="eyes" title="Olhos"></div>
                        <div class="drop-zone ears" data-zone="ears" title="Ouvidos"></div>
                        <div class="drop-zone trunk" data-zone="trunk" title="Tronco"></div>
                        <div class="drop-zone hands" data-zone="hands" title="Mãos"></div>
                        <div class="drop-zone feet" data-zone="feet" title="Pés"></div>
                        <div class="drop-zone anchorage" data-zone="anchorage" title="Ancoragem"></div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="epis-available">
                    <h3>3. EPIs Disponíveis</h3>
                    <div class="epi-list" id="epi-list"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Final -->
    <div class="modal" id="game-modal">
        <div class="modal-content">
            <h2 id="modal-title">Resultado</h2>
            <p id="modal-message"></p>
            <div id="certificate">
                <h3>Certificado de Conclusão</h3>
                <p>Treinamento de Segurança (NRs)</p>
                <p>Pontuação: <strong id="cert-score">0</strong></p>
            </div>
            <div class="modal-buttons">
                <button onclick="restartGame()">Reiniciar Treinamento</button>
            </div>
        </div>
    </div>

    <script>
        const svgCardIcons = {
            cap_classe_b: `<svg viewBox="0 0 64 64"><path d="M12 40 C12 18, 52 18, 52 40 L58 44 L6 44 Z" fill="#ffc107"/><rect x="22" y="38" width="20" height="4" fill="#333"/></svg>`,
            cap_comum: `<svg viewBox="0 0 64 64"><path d="M12 40 C12 20, 52 20, 52 40 L58 44 L6 44 Z" fill="#ffffff"/><rect x="20" y="38" width="24" height="4" fill="#007bff"/></svg>`,
            mascara_solda: `<svg viewBox="0 0 64 64"><path d="M18 12 L46 12 L48 48 C48 56, 16 56, 16 48 Z" fill="#212529"/><rect x="24" y="24" width="16" height="10" fill="#28a745" stroke="#fff"/></svg>`,
            oculos_protecao: `<svg viewBox="0 0 64 64"><path d="M8 26 C8 20, 28 20, 28 26 L28 36 C28 42, 8 42, 8 36 Z" fill="#17a2b8"/><path d="M36 26 C36 20, 56 20, 56 26 L56 36 C56 42, 36 42, 36 36 Z" fill="#17a2b8"/><rect x="26" y="28" width="12" height="4" fill="#333"/></svg>`,
            protetor_plug: `<svg viewBox="0 0 64 64"><path d="M16 20 L24 20 L20 36 Z" fill="#ff5722"/><path d="M48 20 L40 20 L44 36 Z" fill="#ff5722"/><path d="M20 36 Q32 54 44 36" fill="none" stroke="#ffc107" stroke-width="3"/></svg>`,
            abafador_concha: `<svg viewBox="0 0 64 64"><path d="M16 20 Q32 4 48 20" fill="none" stroke="#333" stroke-width="6"/><rect x="10" y="24" width="12" height="22" rx="5" fill="#dc3545"/><rect x="42" y="24" width="12" height="22" rx="5" fill="#dc3545"/></svg>`,
            vestiment_nr10: `<svg viewBox="0 0 64 64"><path d="M16 12 L48 12 L56 56 L8 56 Z" fill="#fd7e14"/><rect x="12" y="32" width="40" height="6" fill="#e0e0e0"/></svg>`,
            avental_raspa: `<svg viewBox="0 0 64 64"><path d="M20 12 L44 12 L48 58 L16 58 Z" fill="#8d6e63"/></svg>`,
            colete_refletivo: `<svg viewBox="0 0 64 64"><path d="M16 12 L48 12 L54 54 L10 54 Z" fill="#ccff00"/><rect x="12" y="28" width="40" height="6" fill="#e0e0e0"/></svg>`,
            luva_dieletrica: `<svg viewBox="0 0 64 64"><path d="M16 20 L24 10 L32 20 L32 50 L16 50 Z" fill="#212529"/><rect x="16" y="42" width="32" height="8" fill="#dc3545"/></svg>`,
            luva_raspa: `<svg viewBox="0 0 64 64"><path d="M18 16 L28 8 L38 16 L38 52 L18 52 Z" fill="#d7ccc8"/></svg>`,
            luva_vaqueta: `<svg viewBox="0 0 64 64"><path d="M18 16 L28 8 L38 16 L38 52 L18 52 Z" fill="#fff8e1"/></svg>`,
            bota_dieletrica: `<svg viewBox="0 0 64 64"><path d="M16 12 L32 12 L32 40 L52 40 L52 52 L16 52 Z" fill="#212529"/><rect x="16" y="48" width="36" height="6" fill="#ffc107"/></svg>`,
            botina_biqueira: `<svg viewBox="0 0 64 64"><path d="M16 16 L32 16 L32 40 L52 40 L52 52 L16 52 Z" fill="#5d4037"/></svg>`,
            cinto_paraquedista: `<svg viewBox="0 0 64 64"><path d="M20 10 L26 54 M44 10 L38 54 M16 28 L48 28" stroke="#ff5722" stroke-width="5" fill="none"/></svg>`,
            linha_vida: `<svg viewBox="0 0 64 64"><rect x="20" y="12" width="24" height="28" rx="4" fill="#dc3545"/></svg>`
        };

        const fittedEpiGraphics = {
            cap_classe_b: `<path d="M72 48 C72 24, 128 24, 128 48 L140 52 L60 52 Z" fill="#ffc107" stroke="#333" stroke-width="1.5"/><rect x="85" y="45" width="30" height="5" fill="#333"/>`,
            cap_comum: `<path d="M72 48 C72 24, 128 24, 128 48 L140 52 L60 52 Z" fill="#ffffff" stroke="#ccc" stroke-width="1.5"/><rect x="85" y="45" width="30" height="5" fill="#007bff"/>`,
            mascara_solda: `<path d="M72 38 L128 38 L130 88 C130 98, 70 98, 70 88 Z" fill="#212529"/><rect x="82" y="52" width="36" height="15" fill="#28a745" stroke="#fff"/>`,
            oculos_protecao: `<path d="M82 60 C82 54, 96 54, 96 60 L96 72 C96 75, 82 75, 82 72 Z" fill="#17a2b8" opacity="0.9" stroke="#fff"/><path d="M104 60 C104 54, 118 54, 118 60 L118 72 C118 75, 104 75, 104 72 Z" fill="#17a2b8" opacity="0.9" stroke="#fff"/><rect x="94" y="63" width="12" height="3" fill="#333"/>`,
            protetor_plug: `<circle cx="75" cy="68" r="4" fill="#ff5722"/><circle cx="125" cy="68" r="4" fill="#ff5722"/>`,
            abafador_concha: `<path d="M74 48 Q100 30 126 48" fill="none" stroke="#333" stroke-width="5"/><rect x="68" y="58" width="10" height="20" rx="4" fill="#dc3545"/><rect x="122" y="58" width="10" height="20" rx="4" fill="#dc3545"/>`,
            vestiment_nr10: `<path d="M55 108 Q100 98 145 108 L148 222 L52 222 Z" fill="#fd7e14"/><rect x="60" y="170" width="80" height="12" fill="#e0e0e0"/>`,
            avental_raspa: `<path d="M75 110 L125 110 L135 225 L65 225 Z" fill="#8d6e63"/>`,
            colete_refletivo: `<path d="M56 108 Q100 98 144 108 L147 220 L53 220 Z" fill="#ccff00" opacity="0.9"/><rect x="60" y="140" width="80" height="10" fill="#e0e0e0"/>`,
            luva_dieletrica: `<path d="M32 188 L48 193 L52 212 L34 212 Z" fill="#212529"/><path d="M168 188 L152 193 L148 212 L166 212 Z" fill="#212529"/>`,
            luva_raspa: `<path d="M32 188 L48 193 L52 212 L34 212 Z" fill="#d7ccc8"/><path d="M168 188 L152 193 L148 212 L166 212 Z" fill="#d7ccc8"/>`,
            luva_vaqueta: `<path d="M32 188 L48 193 L52 212 L34 212 Z" fill="#fff8e1"/><path d="M168 188 L152 193 L148 212 L166 212 Z" fill="#fff8e1"/>`,
            bota_dieletrica: `<path d="M60 340 L90 340 L90 365 C90 370 60 370 60 365 Z" fill="#212529"/><path d="M110 340 L140 340 L140 365 C140 370 110 370 110 365 Z" fill="#212529"/>`,
            botina_biqueira: `<path d="M60 340 L90 340 L90 365 C90 370 60 370 60 365 Z" fill="#5d4037"/><path d="M110 340 L140 340 L140 365 C140 370 110 370 110 365 Z" fill="#5d4037"/>`,
            cinto_paraquedista: `<path d="M72 110 L82 220 M128 110 L118 220 M60 145 L140 145" stroke="#ff5722" stroke-width="4" fill="none"/>`,
            linha_vida: `<path d="M100 185 L100 270 L140 290" stroke="#dc3545" stroke-width="4" fill="none"/>`
        };

        const episDatabase = [
            { id: 'cap_classe_b', name: 'Capacete Classe B', zone: 'head', validFor: ['eletricista'] },
            { id: 'cap_comum', name: 'Capacete Obra', zone: 'head', validFor: ['maquinas'] },
            { id: 'mascara_solda', name: 'Máscara de Solda', zone: 'head', validFor: ['soldador'] },
            { id: 'oculos_protecao', name: 'Óculos de Proteção', zone: 'eyes', validFor: ['eletricista', 'maquinas'] },
            { id: 'protetor_plug', name: 'Protetor Plug', zone: 'ears', validFor: ['soldador', 'eletricista'] },
            { id: 'abafador_concha', name: 'Protetor Concha', zone: 'ear', validFor: ['maquinas'] },
            { id: 'vestiment_nr10', name: 'Traje NR10', zone: 'trunk', validFor: ['eletricista'] },
            { id: 'avental_raspa', name: 'Avental Raspa', zone: 'trunk', validFor: ['soldador'] },
            { id: 'colete_refletivo', name: 'Colete Refletivo', zone: 'trunk', validFor: ['maquinas'] },
            { id: 'luva_dieletrica', name: 'Luva Dielétrica', zone: 'hands', validFor: ['eletricista'] },
            { id: 'luva_raspa', name: 'Luva de Raspa', zone: 'hands', validFor: ['soldador'] },
            { id: 'luva_vaqueta', name: 'Luva Vaqueta', zone: 'hands', validFor: ['maquinas'] },
            { id: 'bota_dieletrica', name: 'Bota Isolante', zone: 'feet', validFor: ['eletricista'] },
            { id: 'botina_biqueira', name: 'Botina Biqueira', zone: 'feet', validFor: ['soldador', 'maquinas'] },
            { id: 'cinto_paraquedista', name: 'Cinto Paraquedista', zone: 'anchorage', validFor: ['eletricista'] },
            { id: 'linha_vida', name: 'Trava-Quedas', zone: 'anchorage', validFor: [] }
        ];

        let currentScenario = 'eletricista';
        let score = 0;
        let lives = 3;
        let timeLeft = 60;
        let timerInterval = null;
        let equippedZoneItems = {};
        let selectedEpi = null;

        const scenarioRequirements = {
            eletricista: ['head', 'eyes', 'ears', 'trunk', 'hands', 'feet', 'anchorage'],
            soldador: ['head', 'ears', 'trunk', 'hands', 'feet'],
            maquinas: ['head', 'eyes', 'ears', 'trunk', 'hands', 'feet']
        };

        const epiListEl = document.getElementById('epi-list');
        const timerEl = document.querySelector('#timer .value');
        const scoreEl = document.querySelector('#score .value');
        const livesEl = document.querySelector('#lives .value');
        const dropZones = document.querySelectorAll('.drop-zone');

        function initGame() {
            score = 0;
            lives = 3;
            timeLeft = 60;
            equippedZoneItems = {};
            selectedEpi = null;
            updateHUD();
            renderEPIs();
            resetWorkerOutfit();
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame(false, "O tempo esgotou!");
                }
            }, 1000);
        }

        function updateHUD() {
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            timerEl.textContent = timeLeft;
        }

        function renderEPIs() {
            epiListEl.innerHTML = '';
            episDatabase.forEach(epi => {
                const item = document.createElement('div');
                item.className = 'epi-item';
                item.draggable = true;
                item.dataset.id = epi.id;
                item.innerHTML = `${svgCardIcons[epi.id]}<span>${epi.name}</span>`;

                // Clique para Selecionar
                item.onclick = () => {
                    document.querySelectorAll('.epi-item').forEach(i => i.classList.remove('selected'));
                    if (selectedEpi === epi) {
                        selectedEpi = null;
                    } else {
                        selectedEpi = epi;
                        item.classList.add('selected');
                    }
                };

                // Suporte a Arraste (Desktop)
                item.ondragstart = (e) => {
                    selectedEpi = epi;
                    e.dataTransfer.setData('text/plain', epi.id);
                };

                // Suporte a Toque Continuo (Mobile Touch Dragging)
                item.ontouchstart = (e) => {
                    selectedEpi = epi;
                    document.querySelectorAll('.epi-item').forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');
                };

                epiListEl.appendChild(item);
            });
        }

        function resetWorkerOutfit() {
            ['head', 'eyes', 'ears', 'trunk', 'hands', 'feet', 'anchorage'].forEach(layer => {
                const el = document.getElementById(`layer-${layer}`);
                if (el) el.innerHTML = '';
            });
        }

        // Configuração de Drop Zones (Mouse + Touch)
        dropZones.forEach(zone => {
            zone.onclick = () => {
                if (selectedEpi) {
                    processDrop(zone, selectedEpi);
                }
            };

            zone.ondragover = (e) => e.preventDefault();
            zone.ondrop = (e) => {
                e.preventDefault();
                if (selectedEpi) {
                    processDrop(zone, selectedEpi);
                }
            };

            // Suporte para Soltar com o Dedo (Mobile)
            zone.ontouchend = (e) => {
                if (selectedEpi) {
                    processDrop(zone, selectedEpi);
                }
            };
        });

        function processDrop(zone, epi) {
            const targetZone = zone.dataset.zone;

            if (epi.zone !== targetZone) {
                registerError(`O item ${epi.name} não pertence a essa parte do corpo.`);
                return;
            }

            if (epi.validFor.includes(currentScenario)) {
                equippedZoneItems[targetZone] = epi.id;
                document.getElementById(`layer-${targetZone}`).innerHTML = fittedEpiGraphics[epi.id];
                
                selectedEpi = null;
                document.querySelectorAll('.epi-item').forEach(i => i.classList.remove('selected'));

                score += 15;
                updateHUD();
                checkWinCondition();
            } else {
                registerError(`${epi.name} não é adequado para este cenário!`);
            }
        }

        function registerError(reason) {
            lives--;
            score = Math.max(0, score - 5);
            updateHUD();
            if (lives <= 0) {
                endGame(false, reason);
            } else {
                alert(reason);
            }
        }

        function checkWinCondition() {
            const required = scenarioRequirements[currentScenario];
            const win = required.every(z => equippedZoneItems[z]);
            if (win) {
                score += timeLeft * 2;
                endGame(true, "Parabéns! O trabalhador está totalmente protegido conforme as NRs!");
            }
        }

        function endGame(isWin, message) {
            clearInterval(timerInterval);
            const modal = document.getElementById('game-modal');
            document.getElementById('modal-title').textContent = isWin ? "Treinamento Concluído!" : "Aviso de Segurança!";
            document.getElementById('modal-message').textContent = message;
            document.getElementById('certificate').style.display = isWin ? 'block' : 'none';
            if (isWin) document.getElementById('cert-score').textContent = score;
            modal.style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('game-modal').style.display = 'none';
            initGame();
        }

        document.querySelectorAll('.scenario-buttons button').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.scenario-buttons button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentScenario = e.target.dataset.scenario;
                initGame();
            };
        });

        window.onload = initGame;
    </script>
</body>
</html>
